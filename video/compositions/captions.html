<div id="root" data-composition-id="captions" data-width="1920" data-height="1080">
  <div id="cap0" class="cap clip" data-start="0.440" data-duration="1.443"><span>I run Eygentic.</span></div>
<div id="cap1" class="cap clip" data-start="1.853" data-duration="4.647"><span>We help small B2B teams figure out what actually brings them customers.</span></div>
<div id="cap2" class="cap clip" data-start="20.250" data-duration="2.558"><span>Before this hackathon I had a rough prototype.</span></div>
<div id="cap3" class="cap clip" data-start="22.778" data-duration="2.798"><span>This week I rebuilt it on Muse Spark.</span></div>
<div id="cap4" class="cap clip" data-start="25.546" data-duration="2.444"><span>Here&#x27;s what it does now.</span></div>
<div id="cap5" class="cap clip" data-start="27.980" data-duration="1.262"><span>I type in my website.</span></div>
<div id="cap6" class="cap clip" data-start="29.212" data-duration="2.238"><span>That&#x27;s the only thing it asks for.</span></div>
<div id="cap7" class="cap clip" data-start="31.420" data-duration="3.270"><span>First it reads my site and works out what I sell,</span></div>
<div id="cap8" class="cap clip" data-start="34.660" data-duration="1.310"><span>who buys it,</span></div>
<div id="cap9" class="cap clip" data-start="35.940" data-duration="3.060"><span>and what would make a company need us right now.</span></div>
<div id="cap10" class="cap clip" data-start="38.970" data-duration="1.430"><span>It looks up my competitors,</span></div>
<div id="cap11" class="cap clip" data-start="40.370" data-duration="2.820"><span>and checks each one against their own homepage.</span></div>
<div id="cap12" class="cap clip" data-start="43.160" data-duration="3.662"><span>Then it looks for companies showing that need today.</span></div>
<div id="cap13" class="cap clip" data-start="46.792" data-duration="2.131"><span>Open job posts on Lever,</span></div>
<div id="cap14" class="cap clip" data-start="48.893" data-duration="2.452"><span>Greenhouse and Ashby, news,</span></div>
<div id="cap15" class="cap clip" data-start="51.315" data-duration="1.345"><span>product launches.</span></div>
<div id="cap16" class="cap clip" data-start="52.630" data-duration="2.137"><span>It even reads a company&#x27;s site code,</span></div>
<div id="cap17" class="cap clip" data-start="54.737" data-duration="2.513"><span>so it knows if they already use a competitor.</span></div>
<div id="cap18" class="cap clip" data-start="57.220" data-duration="3.070"><span>Every quote it finds goes to a second model,</span></div>
<div id="cap19" class="cap clip" data-start="60.260" data-duration="2.638"><span>Muse Spark Open on Baseten.</span></div>
<div id="cap20" class="cap clip" data-start="62.868" data-duration="2.275"><span>That one can&#x27;t browse.</span></div>
<div id="cap21" class="cap clip" data-start="65.113" data-duration="3.357"><span>It only sees the quote and what it&#x27;s supposed to prove,</span></div>
<div id="cap22" class="cap clip" data-start="68.440" data-duration="3.080"><span>and it throws out anything that doesn&#x27;t hold up.</span></div>
<div id="cap23" class="cap clip" data-start="71.660" data-duration="2.010"><span>Here&#x27;s a search I finished earlier.</span></div>
<div id="cap24" class="cap clip" data-start="73.640" data-duration="2.090"><span>ThriveCart made the shortlist.</span></div>
<div id="cap25" class="cap clip" data-start="75.700" data-duration="3.270"><span>Their job post says they&#x27;re hiring one of the first three SDRs</span></div>
<div id="cap26" class="cap clip" data-start="78.940" data-duration="1.958"><span>for a new enterprise push.</span></div>
<div id="cap27" class="cap clip" data-start="80.868" data-duration="3.132"><span>That&#x27;s exactly when a team needs us.</span></div>
<div id="cap28" class="cap clip" data-start="83.970" data-duration="2.930"><span>It drafts the first line of my email from that quote,</span></div>
<div id="cap29" class="cap clip" data-start="86.870" data-duration="2.840"><span>and the second model checks it before I see it.</span></div>
<div id="cap30" class="cap clip" data-start="89.750" data-duration="2.440"><span>Storable looked like a good fit at first.</span></div>
<div id="cap31" class="cap clip" data-start="92.160" data-duration="2.494"><span>But their about page says they have over 800 employees,</span></div>
<div id="cap32" class="cap clip" data-start="94.624" data-duration="3.593"><span>and we work with seed to Series A.</span></div>
<div id="cap33" class="cap clip" data-start="98.187" data-duration="3.233"><span>So it&#x27;s rejected, and it shows me why.</span></div>
<div id="cap34" class="cap clip" data-start="110.480" data-duration="2.601"><span>I can also see everything that got thrown out.</span></div>
<div id="cap35" class="cap clip" data-start="113.051" data-duration="4.339"><span>Across my searches, that was about a third of all quotes.</span></div>
<div id="cap36" class="cap clip" data-start="117.360" data-duration="1.810"><span>If it can&#x27;t prove something,</span></div>
<div id="cap37" class="cap clip" data-start="119.140" data-duration="2.106"><span>the company goes to Needs a look,</span></div>
<div id="cap38" class="cap clip" data-start="121.216" data-duration="1.534"><span>with what&#x27;s missing.</span></div>
<div id="cap39" class="cap clip" data-start="122.720" data-duration="1.090"><span>No website yet?</span></div>
<div id="cap40" class="cap clip" data-start="123.780" data-duration="2.170"><span>You can just describe what you sell.</span></div>
<div id="cap41" class="cap clip" data-start="125.920" data-duration="3.810"><span>This search covered five companies and cost 42 cents.</span></div>
<div id="cap42" class="cap clip" data-start="129.700" data-duration="3.240"><span>And every quote links back to where it came from.</span></div>
