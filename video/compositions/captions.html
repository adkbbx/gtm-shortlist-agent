  <div id="cap0" class="cap clip" data-start="0.440" data-duration="1.443"><span>I run Eygentic.</span></div>
<div id="cap1" class="cap clip" data-start="1.853" data-duration="4.647"><span>We help small B2B teams figure out what actually brings them customers.</span></div>
<div id="cap2" class="cap clip" data-start="25.260" data-duration="1.262"><span>I type in my website.</span></div>
<div id="cap3" class="cap clip" data-start="26.492" data-duration="2.238"><span>That&#x27;s the only thing it asks for.</span></div>
<div id="cap4" class="cap clip" data-start="28.700" data-duration="3.270"><span>First it reads my site and works out what I sell,</span></div>
<div id="cap5" class="cap clip" data-start="31.940" data-duration="1.310"><span>who buys it,</span></div>
<div id="cap6" class="cap clip" data-start="33.220" data-duration="3.060"><span>and what would make a company need us right now.</span></div>
<div id="cap7" class="cap clip" data-start="36.250" data-duration="1.430"><span>It looks up my competitors,</span></div>
<div id="cap8" class="cap clip" data-start="37.650" data-duration="2.820"><span>and checks each one against their own homepage.</span></div>
<div id="cap9" class="cap clip" data-start="40.440" data-duration="3.662"><span>Then it looks for companies showing that need today.</span></div>
<div id="cap10" class="cap clip" data-start="44.072" data-duration="2.131"><span>Open job posts on Lever,</span></div>
<div id="cap11" class="cap clip" data-start="46.173" data-duration="2.452"><span>Greenhouse and Ashby, news,</span></div>

<div id="cap13" class="cap clip" data-start="49.910" data-duration="2.137"><span>It even reads a company&#x27;s site code,</span></div>

<div id="cap15" class="cap clip" data-start="54.500" data-duration="2.990"><span>Every quote it finds goes to a second model,</span></div>
<div id="cap16" class="cap clip" data-start="57.460" data-duration="2.697"><span>Muse Spark Open on Baseten.</span></div>
<div id="cap17" class="cap clip" data-start="60.127" data-duration="1.683"><span>It can&#x27;t browse.</span></div>
<div id="cap18" class="cap clip" data-start="61.780" data-duration="1.750"><span>It only sees the quote,</span></div>
<div id="cap19" class="cap clip" data-start="63.500" data-duration="2.740"><span>and it throws out anything that doesn&#x27;t hold up.</span></div>
<div id="cap20" class="cap clip" data-start="66.380" data-duration="2.010"><span>Here&#x27;s a search I finished earlier.</span></div>
<div id="cap21" class="cap clip" data-start="68.360" data-duration="2.170"><span>ContactMonkey made the shortlist.</span></div>
<div id="cap22" class="cap clip" data-start="70.500" data-duration="1.750"><span>Their job post says they&#x27;re growing,</span></div>
<div id="cap23" class="cap clip" data-start="72.220" data-duration="2.454"><span>and hiring four sales development reps.</span></div>
<div id="cap24" class="cap clip" data-start="74.644" data-duration="2.636"><span>That&#x27;s exactly when a team needs us.</span></div>
<div id="cap25" class="cap clip" data-start="77.250" data-duration="2.450"><span>It writes my opening line from that quote,</span></div>
<div id="cap26" class="cap clip" data-start="79.670" data-duration="4.920"><span>and the second model checks it before I see it.</span></div>
<div id="cap27" class="cap clip" data-start="84.560" data-duration="3.022"><span>It can also draft the whole email and a LinkedIn note,</span></div>
<div id="cap28" class="cap clip" data-start="87.552" data-duration="2.958"><span>from the company&#x27;s quotes and what it learned about my business.</span></div>
<div id="cap29" class="cap clip" data-start="90.480" data-duration="1.740"><span>Those get checked too.</span></div>
<div id="cap30" class="cap clip" data-start="92.260" data-duration="2.440"><span>Storable looked like a good fit at first.</span></div>
<div id="cap31" class="cap clip" data-start="94.670" data-duration="2.494"><span>But their about page says they have over 800 employees,</span></div>
<div id="cap32" class="cap clip" data-start="97.134" data-duration="3.593"><span>and we work with seed to Series A.</span></div>
<div id="cap33" class="cap clip" data-start="100.697" data-duration="3.233"><span>So it&#x27;s rejected, and it shows me why.</span></div>
<div id="cap34" class="cap clip" data-start="109.950" data-duration="2.601"><span>I can also see everything that got thrown out.</span></div>
<div id="cap35" class="cap clip" data-start="112.521" data-duration="4.339"><span>Across my searches, that was about a third of all quotes.</span></div>
<div id="cap36" class="cap clip" data-start="116.830" data-duration="1.810"><span>If it can&#x27;t prove something,</span></div>
<div id="cap37" class="cap clip" data-start="118.610" data-duration="2.106"><span>the company goes to Needs a look,</span></div>
<div id="cap38" class="cap clip" data-start="120.686" data-duration="1.534"><span>with what&#x27;s missing.</span></div>
<div id="cap39" class="cap clip" data-start="122.190" data-duration="1.090"><span>No website yet?</span></div>
<div id="cap40" class="cap clip" data-start="123.250" data-duration="2.170"><span>You can just describe what you sell.</span></div>
<div id="cap41" class="cap clip" data-start="125.390" data-duration="3.810"><span>This search covered five companies and cost 42 cents.</span></div>
<div id="cap42" class="cap clip" data-start="129.170" data-duration="3.240"><span>And every quote links back to where it came from.</span></div>
